<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <linearGradient id="cyanOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#ff6605"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Tech Icon -->
  <g transform="translate(30, 20)">
    <circle cx="60" cy="40" r="16" fill="#00ffff" filter="url(#glow)"/>
    <path d="M60 40 C 110 40, 110 80, 85 80 C 60 80, 60 120, 110 120" fill="none" stroke="url(#cyanOrange)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="110" cy="120" r="16" fill="#ff6605" filter="url(#glow)"/>
  </g>

  <!-- Brand Text -->
  <text x="180" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="3">HUBSTRY</text>
  <text x="182" y="118" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="20" fill="#00ffff" letter-spacing="8">DEEP TECH</text>
</svg>
