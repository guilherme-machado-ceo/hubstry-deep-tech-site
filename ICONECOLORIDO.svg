<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="100%" stop-color="#141826"/>
    </linearGradient>
    <linearGradient id="cyanOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#ff6605"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgGrad)" stroke="#1e2436" stroke-width="4"/>
  
  <g transform="translate(15, 10)">
    <circle cx="60" cy="50" r="18" fill="#00ffff" filter="url(#glow)"/>
    <path d="M60 50 C 130 50, 130 110, 100 110 C 70 110, 70 170, 140 170" fill="none" stroke="url(#cyanOrange)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="140" cy="170" r="18" fill="#ff6605" filter="url(#glow)"/>
  </g>
</svg>