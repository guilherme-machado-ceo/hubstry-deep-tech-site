<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" width="700" height="120">
  <g transform="translate(10, 10)">
    <!-- 3 Icon Loops -->
    <!-- Loop 1 (White) -->
    <rect x="0" y="20" width="26" height="60" rx="13" fill="none" stroke="#ffffff" stroke-width="6"/>
    <!-- Loop 2 (Grey) -->
    <rect x="32" y="20" width="26" height="60" rx="13" fill="none" stroke="#888888" stroke-width="6"/>
    <!-- Loop 3 (White) -->
    <rect x="64" y="20" width="26" height="60" rx="13" fill="none" stroke="#ffffff" stroke-width="6"/>

    <!-- ILMO Text -->
    <text x="110" y="68" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="58" fill="#ffffff" letter-spacing="1">ILMO</text>
    
    <!-- by Hubstry Text -->
    <text x="270" y="68" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="500" font-size="42" fill="#ffffff">by Hubstry</text>
  </g>
</svg>
