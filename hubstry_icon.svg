<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <filter id="glow-c" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-o" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Orange dot (lower-left) -->
  <circle cx="20" cy="38" r="10" fill="#ff5500" filter="url(#glow-o)"/>
  <!-- Cyan dot (upper-right) -->
  <circle cx="40" cy="22" r="10" fill="#00e5ff" filter="url(#glow-c)"/>
</svg>
