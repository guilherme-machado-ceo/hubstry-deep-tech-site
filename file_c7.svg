<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c8c8"/>
      <stop offset="100%" stop-color="#008b8b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6605"/>
      <stop offset="100%" stop-color="#d94e00"/>
    </linearGradient>
  </defs>

  <!-- Outer background container -->
  <rect width="1600" height="900" rx="32" fill="url(#bgLight)"/>
  <rect x="20" y="20" width="1560" height="860" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Header Banner -->
  <rect x="60" y="60" width="1480" height="110" rx="16" fill="#0a0b10"/>
  <text x="100" y="105" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#ff6605" letter-spacing="4">HUBSTRY DEEP TECH · METODOLOGIA PROPRIETÁRIA</text>
  <text x="100" y="142" font-family="system-ui, sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="1">ILMO: O PERCURSO DE CONFORMIDADE &amp; SEGURANÇA PÓS-QUÂNTICA</text>

  <!-- 3 Phase Cards Container -->
  <!-- Phase 1 -->
  <g transform="translate(60, 210)">
    <rect width="460" height="580" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="460" height="70" rx="20" fill="#0a0b10"/>
    <rect y="50" width="460" height="20" fill="#0a0b10"/>
    <text x="30" y="44" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#00ffff" letter-spacing="2">FASE 01 · DIAGNÓSTICO</text>
    <text x="30" y="120" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#0f172a">Mapeamento &amp; Inventário Criptográfico</text>
    
    <g transform="translate(30, 160)" font-family="system-ui, sans-serif" font-size="16" fill="#334155">
      <circle cx="10" cy="15" r="6" fill="#ff6605"/>
      <text x="28" y="20" font-weight="700">Inventário de Algoritmos Ativos</text>
      <text x="28" y="42" font-size="14" fill="#64748b">Identificação de RSA, ECC e SHA clássicos na infraestrutura.</text>

      <circle cx="10" cy="95" r="6" fill="#ff6605"/>
      <text x="28" y="100" font-weight="700">Análise de Vulnerabilidade PQC</text>
      <text x="28" y="122" font-size="14" fill="#64748b">Cálculo do risco de interceptação "Harvest Now, Decrypt Later".</text>

      <circle cx="10" cy="175" r="6" fill="#ff6605"/>
      <text x="28" y="180" font-weight="700">Conformidade BACEN &amp; ICP-Brasil</text>
      <text x="28" y="202" font-size="14" fill="#64748b">Cruzamento regulatório de requisitos legais e normativos.</text>
    </g>

    <rect x="30" y="490" width="400" height="50" rx="12" fill="#0a0b10"/>
    <text x="230" y="522" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#00ffff" text-anchor="middle">ENTREGÁVEL: MATRIZ DE RISCO PQC</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 535 500 L 565 500" stroke="#ff6605" stroke-width="6" stroke-linecap="round"/>

  <!-- Phase 2 -->
  <g transform="translate(570, 210)">
    <rect width="460" height="580" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="460" height="70" rx="20" fill="#0a0b10"/>
    <rect y="50" width="460" height="20" fill="#0a0b10"/>
    <text x="30" y="44" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ff6605" letter-spacing="2">FASE 02 · ARQUITETURA</text>
    <text x="30" y="120" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#0f172a">Transição Pós-Quântica &amp; Governança</text>
    
    <g transform="translate(30, 160)" font-family="system-ui, sans-serif" font-size="16" fill="#334155">
      <circle cx="10" cy="15" r="6" fill="#00ffff"/>
      <text x="28" y="20" font-weight="700">Criptografia Híbrida NIST PQC</text>
      <text x="28" y="42" font-size="14" fill="#64748b">Adoção combinada de Kyber/ML-KEM e Dilithium/ML-DSA.</text>

      <circle cx="10" cy="95" r="6" fill="#00ffff"/>
      <text x="28" y="100" font-weight="700">Governança de Inteligência Artificial</text>
      <text x="28" y="122" font-size="14" fill="#64748b">Isolamento e controle de integridade dos pipelines de IA/LLM.</text>

      <circle cx="10" cy="175" r="6" fill="#00ffff"/>
      <text x="28" y="180" font-weight="700">Agilidade Criptográfica (Crypto-Agility)</text>
      <text x="28" y="202" font-size="14" fill="#64748b">Substituição modular de algoritmos sem interrupção operacional.</text>
    </g>

    <rect x="30" y="490" width="400" height="50" rx="12" fill="#0a0b10"/>
    <text x="230" y="522" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#ff6605" text-anchor="middle">ENTREGÁVEL: ROADMAP DE MIGRAÇÃO</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 1045 500 L 1075 500" stroke="#00ffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Phase 3 -->
  <g transform="translate(1080, 210)">
    <rect width="460" height="580" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="460" height="70" rx="20" fill="#0a0b10"/>
    <rect y="50" width="460" height="20" fill="#0a0b10"/>
    <text x="30" y="44" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#10b981" letter-spacing="2">FASE 03 · CERTIFICAÇÃO</text>
    <text x="30" y="120" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#0f172a">Compliance &amp; Monitoramento Dinâmico</text>

    <g transform="translate(30, 160)" font-family="system-ui, sans-serif" font-size="16" fill="#334155">
      <circle cx="10" cy="15" r="6" fill="#10b981"/>
      <text x="28" y="20" font-weight="700">Auditabilidade &amp; Verificação Contínua</text>
      <text x="28" y="42" font-size="14" fill="#64748b">Validação automática em tempo real de chaves e certificados.</text>

      <circle cx="10" cy="95" r="6" fill="#10b981"/>
      <text x="28" y="100" font-weight="700">Relatórios para Conselho &amp; Regulador</text>
      <text x="28" y="122" font-size="14" fill="#64748b">Documentação executiva pronta para fiscalização BACEN/CVM.</text>

      <circle cx="10" cy="175" r="6" fill="#10b981"/>
      <text x="28" y="180" font-weight="700">Selo de Prontidão Quântica ILMO</text>
      <text x="28" y="202" font-size="14" fill="#64748b">Acreditação e comprovação de proteção zero trust avançada.</text>
    </g>

    <rect x="30" y="490" width="400" height="50" rx="12" fill="#0a0b10"/>
    <text x="230" y="522" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#10b981" text-anchor="middle">ENTREGÁVEL: CERTIFICAÇÃO PQC</text>
  </g>
</svg>